name: Build Android APK (Debug)

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # STEP REMOVED: No Decode Keystore
      # We skip the broken base64 step entirely.

      - name: Build Debug APK
        # We run assembleDebug instead of assembleRelease
        # This uses the Android built-in debug key automatically.
        run: ./gradlew app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oid-crash-app
          # This grabs the debug apk
          path: app/build/outputs/apk/debug/*.apk