name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # The -i flag forces it to IGNORE invalid characters (like spaces or ~ $)
          echo "$KEYSTORE_BASE64" | base64 -d -i > ${{ github.workspace }}/oid-release-key.jks

      - name: Build with Gradle
        env:
          # Point Gradle to the file we just created
          KEYSTORE_FILE: ${{ github.workspace }}/oid-release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew app:assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          # This wildcard (*) ensures upload even if signing fails (unsigned apk)
          path: app/build/outputs/apk/release/*.apk